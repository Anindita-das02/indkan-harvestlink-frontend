<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261C"/>
      <stop offset="100%" stop-color="#203B2C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="50%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CD27C"/>
      <stop offset="100%" stop-color="#1B873F"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Subtle Globe Orbit Arc -->
  <path d="M12 32 C12 21 21 12 32 12 C43 12 52 21 52 32 C52 43 43 52 32 52" stroke="#E5C378" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Golden Sprout Stem -->
  <path d="M32 46 C32 38 31 28 32 20" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Golden Harvest Grain / Leaf -->
  <path d="M32 34 C24 34 20 28 21 22 C27 22 31 27 32 34 Z" fill="url(#goldGrad)"/>

  <!-- Right Green Sprout Leaf -->
  <path d="M32 28 C40 27 44 21 43 16 C37 16 33 21 32 28 Z" fill="url(#leafGrad)"/>

  <!-- Top Sprout Bud -->
  <circle cx="32" cy="18" r="3.5" fill="url(#goldGrad)"/>
</svg>